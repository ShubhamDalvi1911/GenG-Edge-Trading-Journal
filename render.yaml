services:
  - type: web
    name: geng-edge-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://gengedgetradingjournal.netlify.app
      - key: BACKEND_URL
        value: https://geng-edge-backend.onrender.com
      - key: CORS_ORIGINS
        value: https://gengedgetradingjournal.netlify.app
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
